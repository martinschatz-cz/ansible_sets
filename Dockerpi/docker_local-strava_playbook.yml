---
- name: Deploy Local Strava Dashboard with Docker Compose on Raspberry Pi
  hosts: local
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - docker.io
        state: present

    - name: Install Docker Compose
      pip:
        name: docker-compose
        state: present

    - name: Ensure project directory exists
      file:
        path: /home/schatzm/local_strava_dashboard
        state: directory

    - name: Clone Git repository
      git:
        repo: https://github.com/martinschatz-cz/local_strava_dashboard.git
        dest: /home/schatzm/local_strava_dashboard
        update: yes

    - name: Build and start Docker Compose project
      community.docker.docker_compose:
        project_src: /home/schatzm/local_strava_dashboard
        state: present
        build: yes