---
- name: Deploy and Build Local Strava Dashboard with Docker Compose via Shell
  hosts: local
  become: yes

  vars:
    your_raspberry_pi_username: "schatzm"
    venv_path: "/home/{{ your_raspberry_pi_username }}/.venv_docker_compose"
    python_version: "3" # Assuming python3 is the desired version

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install essential system packages
      apt:
        name:
          - python{{ python_version }}
          - python{{ python_version }}-pip
          - python{{ python_version }}-venv
          - docker.io
        state: present

    - name: Create virtual environment for Docker Compose
      command:
        cmd: "python{{ python_version }} -m venv {{ venv_path }}"
      args:
        creates: "{{ venv_path }}/bin/activate"

    - name: Upgrade pip and setuptools in virtual environment
      pip:
        name:
          - pip
          - setuptools
        virtualenv: "{{ venv_path }}"
        state: latest

    - name: Install specific PyYAML version in virtual environment
      pip:
        name: pyyaml==5.3.1
        virtualenv: "{{ venv_path }}"

    - name: Install Docker SDK for Python in virtual environment
      pip:
        name: docker
        virtualenv: "{{ venv_path }}"

    - name: Install Docker Compose in virtual environment
      pip:
        name: docker-compose
        virtualenv: "{{ venv_path }}"

    - name: Ensure project directory exists
      file:
        path: /home/{{ your_raspberry_pi_username }}/local_strava_dashboard
        state: directory

    - name: Clone Git repository
      git:
        repo: https://github.com/martinschatz-cz/local_strava_dashboard.git
        dest: /home/{{ your_raspberry_pi_username }}/local_strava_dashboard
        update: yes

    - name: Build and start Docker Compose project
      shell:
        cmd: "{{ venv_path }}/bin/docker-compose up -d --build"
        chdir: /home/{{ your_raspberry_pi_username }}/local_strava_dashboard